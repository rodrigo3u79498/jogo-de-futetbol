
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Free Kick</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game" id="game">
    <div class="crowd">
      <span>🇩🇪</span>
      <div class="score">
        <div class="flag">🇩🇪</div>
        <strong id="score">0 : 1</strong>
        <div class="flag">🇳🇱</div>
      </div>
      <span>🇳🇱</span>
    </div>

    <div class="advertisements">
      <div>BOX10.COM</div>
      <div>BOX10.COM</div>
      <div>BOX10.COM</div>
    </div>

    <section class="field">
      <div class="goal-area"></div>

      <div class="goal">
        <div class="net"></div>
        <div class="keeper" id="keeper">
          <div class="head"></div>
          <div class="body yellow"></div>
          <div class="arms"></div>
          <div class="legs"></div>
        </div>
      </div>

      <div class="wall">
        <div class="player orange">
          <div class="head"></div>
          <div class="body"></div>
          <div class="shorts"></div>
          <div class="legs"></div>
        </div>
        <div class="player orange">
          <div class="head"></div>
          <div class="body"></div>
          <div class="shorts"></div>
          <div class="legs"></div>
        </div>
      </div>

      <div class="midline"></div>
      <div class="arc"></div>

      <div class="aim">
        <label for="direction">Direção do chute</label>
        <input id="direction" type="range" min="-45" max="45" value="0">
        <label for="power">Força</label>
        <input id="power" type="range" min="1" max="100" value="65">
        <button id="shoot">CHUTAR ⚽</button>
        <p id="message">Ajuste a mira e chute!</p>
      </div>

      <div class="trajectory" id="trajectory"></div>
      <div class="ball" id="ball">⚽</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
